# Runs the real one-line installers from arcflare.net on fresh Linux distributions, each in a throwaway
# container that is deleted when the job ends. As an ordinary user with sudo, the way a person installs it,
# and with no git on the system (a fresh desktop install has none).
name: installers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # every Monday
  push:
    branches: [main]
    paths: ["package.json", "bin/**", ".github/workflows/installers.yml"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - archlinux:latest
          - fedora:41
          - opensuse/tumbleweed:latest
          - alpine:3.20
    container: ${{ matrix.distro }}
    steps:
      - name: What a fresh install of this distribution already has (curl, certificates, tar, sudo, a user)
        shell: sh
        run: |
          case "${{ matrix.distro }}" in
            ubuntu*|debian*) apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates sudo tar gzip xz-utils ;;
            archlinux*) pacman -Sy --noconfirm --needed curl ca-certificates sudo tar gzip xz ;;
            fedora*) dnf -y -q install --allowerasing curl ca-certificates sudo tar gzip xz shadow-utils util-linux ;;
            opensuse*) for p in curl ca-certificates sudo tar gzip xz shadow util-linux gawk; do zypper -n -q install --no-recommends "$p" || echo "(no package $p)"; done ;;
            alpine*) apk add -q curl ca-certificates sudo tar bash ;;
          esac
          for c in curl su tar awk; do command -v "$c" >/dev/null || { echo "missing $c after setup"; exit 1; }; done
          id tester >/dev/null 2>&1 || useradd -m -s /bin/sh tester 2>/dev/null || adduser -D -s /bin/sh tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester

      - name: CLI installer (curl -fsSL https://arcflare.net/install.sh | sh)
        shell: sh
        run: |
          if [ "${{ matrix.distro }}" = "alpine:3.20" ]; then
            # musl: the installer is expected to stop and ask for the distribution's Node.js.
            if su - tester -c 'curl -fsSL https://arcflare.net/install.sh | sh' > out.txt 2>&1; then cat out.txt; echo "expected a clear stop on musl"; exit 1; fi
            cat out.txt; grep -q "apk add nodejs npm" out.txt
            apk add -q nodejs npm
          fi
          # The installer prints where it put arcflare and adds that to the shell profile; a new login shell reads it.
          if ! su - tester -c 'set -e
            curl -fsSL https://arcflare.net/install.sh | sh
            export PATH="$HOME/.arcflare/node/bin:$HOME/.arcflare/npm-global/bin:$HOME/.local/bin:$PATH"
            arcflare --version
            arcflare --help >/dev/null' > cli.txt 2>&1; then
            cat cli.txt
            # Public annotation with the end of the output (job logs need admin rights to read).
            msg=$(tail -n 25 cli.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=CLI installer failed on ${{ matrix.distro }}::$msg"
            exit 1
          fi
          cat cli.txt

      - name: Desktop installer (curl -fsSL https://arcflare.net/install-desktop.sh | sh)
        if: ${{ !startsWith(matrix.distro, 'alpine') }}
        shell: sh
        run: |
          su - tester -c 'set -e
            curl -fsSL https://arcflare.net/install-desktop.sh | sh
            ls ~/Applications ~/.local/bin /usr/bin /opt 2>/dev/null | grep -i arcflare'
